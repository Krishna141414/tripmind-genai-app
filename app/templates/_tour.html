{% from "_icons.html" import icon with context %}
{# Guided Tour: spotlight + caption + floating control bar (logic in static/js/tour.js) #}
<div class="tour-spot" id="tour-spot" hidden></div>
<div class="tour-caption" id="tour-caption" hidden>
  <span class="tour-req" id="tour-req"></span>
  <p id="tour-text"></p>
  <div class="tour-progress"><span id="tour-progress-bar"></span></div>
</div>
<div class="tour-bar" id="tour-bar" role="toolbar" aria-label="Guided tour">
  <button class="tour-btn tour-start" id="tour-start" data-tour-start>{{ icon('flag') }}Start Tour</button>
  <div class="tour-controls" id="tour-controls" hidden>
    <button class="tour-btn" id="tour-back" title="Back (←)">{{ icon('arrow-right', 'flip') }}Back</button>
    <button class="tour-btn" id="tour-play" title="Pause / Play (Space)"><span id="tour-play-label">⏸ Pause</span></button>
    <button class="tour-btn" id="tour-next" title="Next (→)">Next{{ icon('arrow-right') }}</button>
    <span class="tour-count" id="tour-count">1 / 1</span>
    <div class="seg" id="tour-speed" role="group" aria-label="Speed">
      <button data-speed="slow">Slow</button><button data-speed="medium">Medium</button><button data-speed="fast">Fast</button>
    </div>
    <button class="tour-btn tour-exit" id="tour-exit" title="Exit tour">{{ icon('x') }}Exit</button>
  </div>
</div>
